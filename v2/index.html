<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b42"><title>Nerja Food Guide V2</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="wrap"><div class="brand">🍽️ Nerja Food Guide <small>V2</small></div><p>Upptäck restauranger i Nerja – med tydliga källor för menyer och bilder.</p><label class="search">Sök restaurang eller kök <input id="search" type="search" placeholder="Till exempel tapas, pizza, La Puntilla"></label><div class="filters"><label><input id="onlyMenu" type="checkbox"> Visa bara med menyunderlag</label><label><input id="onlyPhoto" type="checkbox"> Visa bara med bild</label><select id="sort" aria-label="Sortera"><option value="name">Namn A–Ö</option><option value="menu">Menyer först</option></select></div></div></header><main class="wrap"><p id="summary" role="status">Laddar restauranger…</p><section id="cards" class="cards" aria-label="Restauranger"></section><p id="empty" hidden>Inga restauranger matchar sökningen.</p></main><footer class="wrap">Restauranguppgifter från OpenStreetMap och angivna källor. Menylänkar kan förändras. Inga betalda API:er.</footer><script src="./app.js" defer></script></body></html>
