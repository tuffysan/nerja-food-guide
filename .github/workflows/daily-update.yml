name: Daily restaurant update
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restaurant-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test menu parser and release assets
        run: |
          python -m unittest discover -s tests -v
          node --check assets/guide-v3.js
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); js=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s); Path('/tmp/nerja-inline.js').write_text('\\n'.join(js),encoding='utf-8')"
          node --check /tmp/nerja-inline.js
      - name: Update restaurant directory
        run: python scripts/update.py
      - name: Discover menu links
        run: python scripts/discover_menus.py
      - name: Install free QR decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zbar-tools
      - name: Discover QR and external menu sources
        run: python scripts/menu_discovery_v2.py
      - name: Merge researched official menu sources
        run: python scripts/merge_verified_sources.py
      - name: Install free PDF parser
        run: python -m pip install pypdf==6.1.3
      - name: Install local OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng poppler-utils
      - name: Extract HTML menu candidates
        run: python scripts/extract_html_menus.py
      - name: Extract PDF menu candidates
        run: python scripts/extract_pdf_menus.py
      - name: Extract structured menu prices
        run: python scripts/extract_menus.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("data").glob("*.json")):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as error:
                  raise SystemExit(f"Invalid JSON in {path}: {error}") from error
              print(f"Valid JSON: {path}")
          PY
      - name: Report menu coverage
        run: python scripts/coverage_report.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json data/menu-discovery.json data/auto-menus.json data/pdf-menus.json data/html-menus.json data/coverage-report.json data/html-menu-diagnostics.json data/pdf-menu-diagnostics.json data/menu-discovery-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nerja restaurant data"
            # Code updates may land on main while discovery is running.
            # Replay only the generated-data commit on the current remote head.
            # Abort instead of overwriting or force-pushing on a conflict.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
                echo "Main moved during push; retrying ($attempt/3)"
              else
                git rebase --abort || true
                echo "::error::Generated data conflicts with new commits on main; not overwriting changes"
                exit 1
              fi
              sleep 2
            done
            echo "::error::Main kept moving during data publication; no force push attempted"
            exit 1
          fi
