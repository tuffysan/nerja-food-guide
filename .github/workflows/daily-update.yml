name: Daily restaurant update
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restaurant-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update restaurant directory
        run: python scripts/update.py
      - name: Discover menu links
        run: python scripts/discover_menus.py
      - name: Install free PDF parser\n        run: python -m pip install pypdf==6.1.3\n      - name: Extract PDF menu candidates\n        run: python scripts/extract_pdf_menus.py\n      - name: Extract structured menu prices
        run: python scripts/extract_menus.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json data/menu-discovery.json data/auto-menus.json data/pdf-menus.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nerja restaurant data"
            git push
          fi
