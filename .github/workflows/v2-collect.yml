name: V2 evidence collection
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: write
concurrency:
  group: nerja-v2-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v2-clean
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V2 evidence merge
        run: python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Snapshot existing menu and photo evidence
        run: python v2/preserve_evidence.py snapshot
      - name: Refresh OSM restaurant directory
        run: python scripts/update.py
      - name: Resolve explicitly linked licensed photos
        run: python scripts/update_photos.py
      - name: Crawl official restaurant sites for menus
        run: python scripts/discover_menus.py
      - name: Install free menu extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zbar-tools tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng poppler-utils
          python -m pip install pypdf==6.1.3
      - name: Find QR menus
        run: python scripts/menu_discovery_v2.py
      - name: Include researched official sources
        run: python scripts/merge_verified_sources.py
      - name: Extract HTML menu evidence
        run: python scripts/extract_html_menus.py
      - name: Extract PDF menu evidence
        run: python scripts/extract_pdf_menus.py
      - name: Extract structured dishes
        run: python scripts/extract_menus.py
      - name: Preserve last-known-good menus and photos
        run: python v2/preserve_evidence.py merge
      - name: Audit evidence and data integrity
        run: |
          python scripts/coverage_report.py
          python scripts/content_audit.py
          python scripts/menu_availability_audit.py
          python scripts/quality_gate.py
          python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Upload diagnostics even when collection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerja-v2-discovery-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/*diagnostics.json
            data/coverage-report.json
            data/menu-availability-audit.json
            data/content-audit.json
      - name: Save validated evidence to V2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh V2 restaurant and menu evidence"
            git fetch origin rebuild/v2-clean
            git rebase origin/rebuild/v2-clean
            git push origin HEAD:rebuild/v2-clean
          fi
