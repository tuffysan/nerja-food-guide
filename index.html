<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d57"><title>Nerja Food Guide</title><style>body{margin:0;background:#f4f7f8;color:#17384b;font:16px system-ui}header{background:linear-gradient(120deg,#123d57,#167a91);color:white;padding:38px max(20px,calc((100vw - 1050px)/2))}h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}main{max-width:1050px;margin:auto;padding:22px}input,select,button{font:inherit;border:1px solid #c7d7df;border-radius:10px;padding:12px;background:white}input{flex:2;min-width:180px}select{flex:1;min-width:150px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px #153b4c12}.card h2{margin:0 0 8px;font-size:21px}.muted{color:#607684;font-size:14px}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.links a,.links button{background:#e8f5f8;color:#075a73;text-decoration:none;border-radius:9px;padding:9px 12px;border:0;cursor:pointer}.links a:hover,.links button:hover{background:#cceaf1}.fav{float:right;background:none;border:0;font-size:23px;cursor:pointer}.status{margin:12px 0 22px;color:#536d79}h3{font-size:15px;margin:16px 0 8px}.menu-preview{margin-top:12px;padding:12px;background:#f2f8f9;border-radius:10px}.dish{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #dce9ed;font-size:14px}.dish strong{white-space:nowrap}.menu-preview small{display:block;margin-top:10px;color:#647b86}footer{padding:30px;text-align:center;color:#607684}a{color:#08738e}</style></head><body><header><h1>🍽️ Nerja Food Guide</h1><p>Upptäck restauranger, caféer och menyer i Nerja, Spanien.</p></header><main><div class="filters"><input id="search" placeholder="Sök restaurang eller kök…" aria-label="Sök restaurang"><select id="type"><option value="">Alla kök</option></select><select id="favorites"><option value="all">Alla restauranger</option><option value="menu">Med menyinformation</option><option value="priced">Med maträtter och priser</option><option value="fav">Mina favoriter</option></select></div><div class="status" id="status">Läser restaurangregistret…</div><section id="cards" class="grid"></section></main><footer>Data © OpenStreetMap-bidragsgivare · Menylänkar kan vara inaktuella · <a href="https://www.openstreetmap.org/copyright">Licens och källor</a></footer><script>
let items=[],discover={},curated=[],autoMenus={},pdfMenus={};const $=id=>document.getElementById(id),favkey='nerja-food-favorites';let fav=new Set(JSON.parse(localStorage.getItem(favkey)||'[]'));function url(u){try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:null}catch{return null}}function el(tag,txt,cls){let n=document.createElement(tag);if(txt!=null)n.textContent=txt;if(cls)n.className=cls;return n}function link(label,u){let a=el('a',label);a.href=u;a.target='_blank';a.rel='noopener noreferrer';return a}function findCurated(r){let name=r.name.toLocaleLowerCase();return curated.find(c=>c.match.some(m=>name.includes(m)))}function hasMenu(r){let d=findCurated(r);return !!(d?.dishes?.length||d?.source||r.menu||(discover[r.id]?.links||[]).some(x=>x.kind!=='website'))}function hasPrices(r){let d=findCurated(r);return !!(d?.dishes?.length||autoMenus[d?.name]?.dishes?.length||pdfMenus[r.id]?.dishes?.length)}function render(){let q=$('search').value.toLocaleLowerCase(),t=$('type').value,filtered=items.filter(r=>(r.name+' '+r.cuisine).toLocaleLowerCase().includes(q)&&(!t||r.cuisine===t)&&($('favorites').value==='all'||($('favorites').value==='fav'&&fav.has(r.id))||($('favorites').value==='menu'&&hasMenu(r))||($('favorites').value==='priced'&&hasPrices(r))));$('cards').replaceChildren();for(let r of filtered){let c=el('article',null,'card'),detail=findCurated(r),f=el('button',fav.has(r.id)?'★':'☆','fav');f.title='Favorit';f.onclick=()=>{fav.has(r.id)?fav.delete(r.id):fav.add(r.id);localStorage.setItem(favkey,JSON.stringify([...fav]));render()};c.append(f,el('h2',r.name),el('p',r.cuisine||'Kök ej angivet','muted'),el('p',r.address||'Adress saknas','muted'));if(r.hours)c.append(el('p','Öppettider (OSM): '+r.hours,'muted'));if(r.description)c.append(el('p',r.description,'muted'));if(r.phone)c.append(el('p','Telefon: '+r.phone,'muted'));if(r.wheelchair)c.append(el('p','Rullstolsanpassning: '+r.wheelchair,'muted'));let pdf=pdfMenus[r.id];if(pdf?.dishes?.length){let preview=el('div',null,'menu-preview');preview.append(el('h3','Möjliga maträtter från PDF – ej verifierade'));for(let dish of pdf.dishes.slice(0,12)){let line=el('div',null,'dish');line.append(el('span',dish[0]),el('strong',dish[1]));preview.append(line)}preview.append(link('Öppna PDF-originalet',pdf.source));c.append(preview)}if(detail){if(detail.note)c.append(el('p',detail.note,'muted'));if(detail.phone&&!r.phone)c.append(el('p','Telefon: '+detail.phone,'muted'));if(detail.dishes.length || autoMenus[detail.name]?.dishes?.length){let menu=el('div',null,'menu-preview');menu.append(el('h3','Maträtter och priser'));let shown=autoMenus[detail.name]?.dishes?.length?autoMenus[detail.name].dishes:detail.dishes;for(let dish of shown){let line=el('div',null,'dish');line.append(el('span',dish[0]),el('strong',dish[1]));menu.append(line)}menu.append(el('small','Priser från publicerad källa – kontrollera alltid med restaurangen.'));c.append(menu)}}let links=el('div',null,'links'),menus=[];if(detail?.source)menus.push({url:detail.source,label:detail.dishes?.length?'Meny / källa':'Restaurangens källa'});if(url(r.menu))menus.push({url:r.menu,label:'Registrerad meny'});for(let x of discover[r.id]?.links||[])if(url(x.url)&&x.kind!=='website')menus.push({url:x.url,label:x.status==='published'?'Meny':'Möjlig meny ('+x.kind+')'});let seen=new Set;for(let m of menus){if(seen.has(m.url))continue;seen.add(m.url);links.append(link(m.label,m.url))}if(!seen.size)links.append(el('span','Ingen digital meny hittad','muted'));if(url(r.website))links.append(link('Webbplats',url(r.website)));if(r.phone){let tel=r.phone.replace(/[^+0-9]/g,'');if(tel){let a=link('Ring','tel:'+tel);links.append(a)}}if(Number.isFinite(r.lat)&&Number.isFinite(r.lon))links.append(link('Karta','https://www.openstreetmap.org/?mlat='+r.lat+'&mlon='+r.lon+'#map=18/'+r.lat+'/'+r.lon));c.append(links);$('cards').append(c)}$('status').textContent=filtered.length+' av '+items.length+' platser visas'+(items.length?' · Senaste datakälla: OpenStreetMap':'')}
for(let id of ['search','type','favorites'])$(id).addEventListener(id==='search'?'input':'change',render);
Promise.all([fetch('data/pdf-menus.json').then(r=>r.ok?r.json():{restaurants:{}}).catch(()=>({restaurants:{}})),fetch('data/auto-menus.json').then(r=>r.ok?r.json():{restaurants:{}}).catch(()=>({restaurants:{}})),fetch('data/curated-menus.json').then(r=>r.ok?r.json():{entries:[]}).catch(()=>({entries:[]})),fetch('data/restaurants.json').then(r=>{if(!r.ok)throw Error('Ingen restaurangdata ännu');return r.json()}),fetch('data/menu-discovery.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([pdf,auto,cur,data,menus])=>{pdfMenus=pdf.restaurants||{};autoMenus=auto.restaurants||{};curated=cur.entries||[];items=(data.items||[]).filter(r=>r.name);for(let c of curated){if(!items.some(r=>findCurated(r)===c)){items.push({id:'curated/'+c.name,name:c.name,cuisine:c.cuisine,address:c.address||'Nerja, Spanien',website:c.source})}}discover=menus.restaurants||{};let types=[...new Set(items.map(x=>x.cuisine).filter(x=>x&&x!=='Ej angivet'))].sort();for(let t of types){let o=el('option',t);o.value=t;$('type').append(o)}render()}).catch(e=>{$('status').textContent='Restaurangregistret är inte hämtat ännu. Kör GitHub Actions → Daily restaurant update → Run workflow. ('+e.message+')'});
</script></body></html>
